<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pond 3 — Water Quality</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF3E1; --panel:#FFFFFF; --panel-2:#FBE7C2;
  --line:rgba(74,49,20,0.16);
  --ink:#3A2A14; --ink-dim:#8A6A3E;
  --green:#2E8B4F; --marigold:#F0921E; --danger:#D6472B; --ok:#2E8B4F;
  --sans:'Space Grotesk',sans-serif; --mono:'IBM Plex Mono',monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#241A0D; --panel:#2E2113; --panel-2:#3A2A16; --line:rgba(251,231,194,0.14);
  --ink:#F5E9D2; --ink-dim:#C9A876;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241A0D; --panel:#2E2113; --panel-2:#3A2A16; --line:rgba(251,231,194,0.14);
    --ink:#F5E9D2; --ink-dim:#C9A876;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;
  padding-bottom:20px;border-bottom:1px solid var(--line);}
.farm{font-size:13px;color:var(--ink-dim);letter-spacing:0.02em;}
h1{font-size:26px;margin:4px 0 0;font-weight:700;}
.clock{font-family:var(--mono);font-size:13px;color:var(--ink-dim);text-align:right;}

.status{margin-top:22px;padding:22px 24px;background:var(--panel-2);border-radius:6px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.status-text{font-size:21px;font-weight:600;}
.status-text .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:10px;}
.status-sub{font-size:13px;color:var(--ink-dim);margin-top:4px;font-family:var(--mono);}
.status.warn .dot{background:var(--marigold);}
.status.alert .dot{background:var(--danger);}

.readings{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:28px;
  border-top:1px solid var(--line);}
.reading{padding:18px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.reading:nth-child(4){border-right:none;}
.r-label{font-size:12px;color:var(--ink-dim);}
.r-value{font-family:var(--mono);font-size:30px;font-weight:600;margin-top:6px;display:flex;align-items:baseline;gap:4px;}
.r-unit{font-size:14px;color:var(--ink-dim);}
.r-range{font-size:11px;color:var(--ink-dim);margin-top:4px;font-family:var(--mono);}
.spark{margin-top:10px;height:32px;}
.spark path{fill:none;stroke-width:1.6;}

@media (max-width:640px){.readings{grid-template-columns:1fr 1fr;} .reading:nth-child(2n){border-right:none;}}

.section-title{font-size:13px;color:var(--ink-dim);margin:34px 0 12px;}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;}
.chart-legend{display:flex;gap:18px;font-size:12px;color:var(--ink-dim);margin-bottom:10px;font-family:var(--mono);}
.chart-legend span{display:inline-flex;align-items:center;gap:6px;}
.chart-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}

.alerts{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:6px;overflow:hidden;}
.alert{background:var(--panel);padding:13px 16px;display:flex;gap:12px;align-items:flex-start;}
.alert .sev{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;}
.alert .body{flex:1;}
.alert .msg{font-size:14px;}
.alert .time{font-size:11px;color:var(--ink-dim);font-family:var(--mono);margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="farm">Delta Crab Farm</div>
      <h1>Pond 3 — Water Quality</h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <div class="status" id="status">
    <div>
      <div class="status-text"><span class="dot"></span>Water quality: Stable</div>
      <div class="status-sub">All four sensors reporting · last sync <span id="syncAgo">–</span> ago</div>
    </div>
    <div class="status-sub" id="statusRight">Connecting to Blynk…</div>
  </div>

  <div class="readings" id="readings"></div>

  <div class="section-title">Live trend — pH &amp; temperature (builds up as readings come in)</div>
  <div class="chart-box">
    <div class="chart-legend">
      <span><i style="background:#2E8B4F"></i>pH</span>
      <span><i style="background:#B5502E"></i>Temperature (°C)</span>
    </div>
    <svg id="trend" viewBox="0 0 760 160" width="100%" height="160"></svg>
  </div>

  <div class="section-title">AI-flagged events</div>
  <div class="alerts" id="alerts"></div>
</div>

<script>
/* ===== FILL THIS IN ===== */
const CONFIG = {
  serverBase: 'https://YOUR-SERVER-URL',  // the deployed pond-server from earlier, e.g. https://your-app.onrender.com
  pollMs: 5000,
  historyLen: 60
};
/* ========================== */

const SENSORS = [
  {key:'ph',   label:'pH',                 unit:'',     decimals:1, range:'safe 7.5–8.5',      color:'#2E8B4F'},
  {key:'turb', label:'Turbidity',          unit:'NTU',  decimals:0, range:'safe < 40',          color:'#1C8C8C'},
  {key:'temp', label:'Temperature',        unit:'°C',   decimals:1, range:'safe 26–31',         color:'#B5502E'},
  {key:'tds',  label:'TDS',                unit:'ppm',  decimals:0, range:'brackish 10k–25k',   color:'#C99A2E'}
];

const series = {}; SENSORS.forEach(s => series[s.key] = []);
let ALERTS = [];
const SEV_COLOR = {ok:'#2E8B4F', warn:'#F0921E', alert:'#D6472B'};

function fmt(s, v){
  return s.decimals===0 ? Math.round(v).toLocaleString() : v.toFixed(s.decimals);
}

function timeAgo(t){
  const mins = Math.max(0, Math.round((Date.now()-t)/60000));
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  return Math.round(mins/60) + 'h ago';
}

function sparkPath(vals,w,h){
  if(vals.length < 2) return '';
  const min=Math.min(...vals), max=Math.max(...vals), pad=(max-min)*0.15 || 1;
  const lo=min-pad, hi=max+pad;
  return vals.map((v,i)=>{
    const x = i/(vals.length-1)*w;
    const y = h - ((v-lo)/(hi-lo))*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

function render(){
  const wrap = document.getElementById('readings');
  wrap.innerHTML = '';
  SENSORS.forEach(s=>{
    const vals = series[s.key];
    const cur = vals.length ? vals[vals.length-1] : null;
    const div = document.createElement('div');
    div.className='reading';
    div.innerHTML = `
      <div class="r-label">${s.label}</div>
      <div class="r-value">${cur===null ? '–' : fmt(s,cur)}<span class="r-unit">${s.unit}</span></div>
      <div class="r-range">${s.range}</div>
      <svg class="spark" viewBox="0 0 120 32" preserveAspectRatio="none">
        <path d="${sparkPath(vals,120,32)}" stroke="${s.color}"/>
      </svg>`;
    wrap.appendChild(div);
  });

  const w=760,h=160,pad=20;
  const mk = (vals,color)=>{
    if(vals.length < 2) return '';
    const min=Math.min(...vals), max=Math.max(...vals), p=(max-min)*0.2||0.5;
    const lo=min-p, hi=max+p;
    const d = vals.map((v,i)=>{
      const x = pad + i/(vals.length-1)*(w-2*pad);
      const y = h-pad - ((v-lo)/(hi-lo))*(h-2*pad);
      return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>`;
  };
  document.getElementById('trend').innerHTML = mk(series.ph,'#2E8B4F') + mk(series.temp,'#B5502E');

  document.getElementById('alerts').innerHTML = ALERTS.slice(0,6).map(a=>`
    <div class="alert">
      <span class="sev" style="background:${SEV_COLOR[a.sev] || SEV_COLOR.ok}"></span>
      <div class="body"><div class="msg">${a.msg}</div><div class="time">${a.time}</div></div>
    </div>`).join('') || `<div class="alert"><div class="body"><div class="msg">No events yet.</div></div></div>`;
}

function updateStatus(){
  const RECENT_MS = 5*60*1000;
  const fresh = ALERTS.filter(a => Date.now() - a.at < RECENT_MS);
  const worst = fresh.some(a=>a.sev==='alert') ? 'alert' : fresh.some(a=>a.sev==='warn') ? 'warn' : 'ok';
  const box = document.getElementById('status');
  const text = box.querySelector('.status-text');
  box.className = 'status ' + (worst==='ok' ? '' : worst);
  text.innerHTML = `<span class="dot"></span>Water quality: ${worst==='ok' ? 'Stable' : worst==='warn' ? 'Watch' : 'Attention needed'}`;
  document.getElementById('statusRight').textContent = worst==='ok' ? 'All readings in range' : 'Check flagged sensor below';
}

let lastSyncAt = null;
async function pollOnce(){
  try{
    const [latest, events] = await Promise.all([
      fetch(`${CONFIG.serverBase}/api/latest`).then(r=>r.json()),
      fetch(`${CONFIG.serverBase}/api/events`).then(r=>r.json())
    ]);

    SENSORS.forEach(s=>{
      const v = latest[s.key];
      if(v===undefined) return;
      const arr = series[s.key];
      arr.push(v);
      if(arr.length > CONFIG.historyLen) arr.shift();
    });

    ALERTS = events.slice(0,6).map(e => ({sev:e.sev, msg:e.msg, time:timeAgo(e.t), at:e.t}));

    updateStatus();
    render();
    lastSyncAt = Date.now();
  }catch(e){
    console.error(e);
    document.getElementById('statusRight').textContent = 'Connection error — check serverBase URL';
  }
}

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});
  const el = document.getElementById('syncAgo');
  el.textContent = lastSyncAt ? Math.round((Date.now()-lastSyncAt)/1000) + 's' : '–';
}
setInterval(tickClock, 1000); tickClock();

render();
pollOnce();
setInterval(pollOnce, CONFIG.pollMs);
</script>

</body>
</html>
